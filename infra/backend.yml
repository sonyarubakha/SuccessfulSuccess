AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings backend on AWS: FastAPI running on ECS Fargate behind an
  Application Load Balancer, connected to Amazon RDS PostgreSQL.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for the names of the resources in this stack.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      At least two subnets in different availability zones.
      The ALB, ECS tasks and RDS PostgreSQL use these subnets.

  ImageUri:
    Type: String
    Description: >-
      Backend image in ECR, preferably pinned by digest.

  ECSCpuArchitecture:
    Type: String
    Default: X86_64
    AllowedValues:
      - X86_64
      - ARM64
    Description: CPU architecture used by the Fargate task.







  DbName:
    Type: String
    Default: meetings

  DbUsername:
    Type: String
    Default: app

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    AllowedPattern: "[a-zA-Z0-9_-]+"

  AppTimezone:
    Type: String
    Default: Europe/Kyiv

  CorsOrigins:
    Type: String
    Default: "*"

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR

  CognitoUserPoolId:
    Type: String

  CognitoClientId:
    Type: String

  CognitoJwks:
    Type: String
    Description: Base64-encoded Cognito JWKS document.



Resources:
  # ---------------------------------------------------------------------------
  # Networking
  # ---------------------------------------------------------------------------

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} application load balancer"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Public HTTP traffic
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} ECS backend tasks"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: ALB to FastAPI
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-backend"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} database"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BackendSecurityGroup
          Description: ECS backend to PostgreSQL
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} database subnets"
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp3
      DBName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      StorageEncrypted: true
      BackupRetentionPeriod: 0
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName


  # ---------------------------------------------------------------------------
  # ECS
  # ---------------------------------------------------------------------------

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-backend"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-backend"
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      RuntimePlatform:
        CpuArchitecture: !Ref ECSCpuArchitecture
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: backend
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: DATABASE_URL
              Value: !Sub
                - "postgresql+asyncpg://${DbUsername}:${DbPassword}@${Endpoint}:${Port}/${DbName}"
                - Endpoint: !GetAtt DbInstance.Endpoint.Address
                  Port: !GetAtt DbInstance.Endpoint.Port

            - Name: APP_TIMEZONE
              Value: !Ref AppTimezone

            - Name: CORS_ORIGINS
              Value: !Ref CorsOrigins

            - Name: LOG_LEVEL
              Value: !Ref LogLevel

            - Name: COGNITO_REGION
              Value: !Ref AWS::Region

            - Name: COGNITO_USER_POOL_ID
              Value: !Ref CognitoUserPoolId

            - Name: COGNITO_CLIENT_ID
              Value: !Ref CognitoClientId

            - Name: COGNITO_JWKS
              Value: !Ref CognitoJwks

            - Name: RUN_MIGRATIONS_ON_START
              Value: "true"

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------------
  # Application Load Balancer
  # ---------------------------------------------------------------------------

  BackendLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-backend"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckPort: traffic-port
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref BackendLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  # ---------------------------------------------------------------------------
  # ECS Service
  # ---------------------------------------------------------------------------

  BackendService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
      - DbInstance
    Properties:
      ServiceName: !Sub "${ProjectName}-backend"
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref BackendTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      EnableECSManagedTags: true
      PropagateTags: SERVICE

      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref BackendSecurityGroup

      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8000
          TargetGroupArn: !Ref BackendTargetGroup

      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
  # ---------------------------------------------------------------------------
  # HTTPS entry point for the API
  # ---------------------------------------------------------------------------

  BackendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${ProjectName} backend HTTPS"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100

        Origins:
          - Id: backend-alb
            DomainName: !GetAtt BackendLoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only

        DefaultCacheBehavior:
          TargetOriginId: backend-alb

          # Browser always uses HTTPS.
          ViewerProtocolPolicy: redirect-to-https

          # API needs all normal HTTP methods.
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE

          CachedMethods:
            - GET
            - HEAD

          # Do not cache API responses.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad

          # Forward Authorization, Origin, query params, cookies, etc.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
Outputs:
  ApiUrl:
    Description: HTTPS base URL of the backend through CloudFront
    Value: !Sub "https://${BackendDistribution.DomainName}"

  AlbUrl:
    Description: Direct HTTP URL of the Application Load Balancer
    Value: !Sub "http://${BackendLoadBalancer.DNSName}"

  BackendDistributionDomain:
    Description: CloudFront domain for the backend API
    Value: !GetAtt BackendDistribution.DomainName

  HealthUrl:
    Description: Backend health check over HTTPS
    Value: !Sub "https://${BackendDistribution.DomainName}/health"

  DocsUrl:
    Description: Swagger UI over HTTPS
    Value: !Sub "https://${BackendDistribution.DomainName}/docs"

  LoadBalancerDnsName:
    Description: Application Load Balancer DNS name
    Value: !GetAtt BackendLoadBalancer.DNSName

  ECSClusterName:
    Description: ECS cluster name
    Value: !Ref ECSCluster

  ECSServiceName:
    Description: ECS service name
    Value: !GetAtt BackendService.Name

  DatabaseEndpoint:
    Description: PostgreSQL database endpoint
    Value: !GetAtt DbInstance.Endpoint.Address

  LogGroupName:
    Description: CloudWatch log group
    Value: !Ref BackendLogGroup
