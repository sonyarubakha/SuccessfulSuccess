AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Compatibility CloudFront distribution for the SuccessfulSuccess backend.
  The distribution preserves the original public backend URL while forwarding
  requests to the serverless Lambda function URL.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess

  ServerlessOriginDomain:
    Type: String
    Description: Lambda Function URL hostname without https://

Resources:
  BackendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${ProjectName} backend HTTPS"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100

        Origins:
          - Id: backend-alb
            DomainName: !Ref ServerlessOriginDomain
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only

        DefaultCacheBehavior:
          TargetOriginId: backend-alb
          ViewerProtocolPolicy: redirect-to-https

          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE

          CachedMethods:
            - GET
            - HEAD

          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  ApiUrl:
    Description: HTTPS base URL of the backend through CloudFront
    Value: !Sub "https://${BackendDistribution.DomainName}"

  BackendDistributionDomain:
    Description: CloudFront domain for the backend API
    Value: !GetAtt BackendDistribution.DomainName

  HealthUrl:
    Description: Backend health check over HTTPS
    Value: !Sub "https://${BackendDistribution.DomainName}/health"

  DocsUrl:
    Description: Swagger UI over HTTPS
    Value: !Sub "https://${BackendDistribution.DomainName}/docs"
