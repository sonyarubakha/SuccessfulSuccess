AWSTemplateFormatVersion: "2010-09-09"
Description: Container registry for the meetings backend image (run by ECS Fargate).

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for the repository name.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-backend"
      # Lets `make aws-destroy` delete the repository without emptying it first.
      EmptyOnDelete: true
      # Lambda pulls the image itself when a function is created or updated.

      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      ImageScanningConfiguration:
        ScanOnPush: true
      # Preserve the existing Lambda retrieval policy during repository updates.
      RepositoryPolicyText:
        Version: "2008-10-17"
        Statement:
          - Sid: LambdaECRImageRetrievalPolicy
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - ecr:SetRepositoryPolicy
              - ecr:DeleteRepositoryPolicy
              - ecr:GetRepositoryPolicy
            Condition:
              StringLike:
                aws:sourceArn: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*"
      # No lifecycle policy during Lab 7: retain tagged and untagged images.

Outputs:
  RepositoryUri:
    Description: Image repository URI (docker push target)
    Value: !GetAtt Repository.RepositoryUri
